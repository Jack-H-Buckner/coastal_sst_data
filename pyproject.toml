[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal_sst_data"
version = "0.6.4"
description = "Acquire and grid coastal SST and covariate data products into analysis-ready datacubes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jack Buckner" }]
keywords = ["sea-surface-temperature", "remote-sensing", "coastal", "xarray", "zarr", "ECOSTRESS", "MODIS"]

# Core runtime deps: everything needed to load a config, build the grids, run the
# always-available stages (MUR/ECOSTRESS/MODIS acquisition + datacube assembly).
# Feature backends with heavier or narrower deps are lazy-imported and live in the
# optional-dependencies extras below, so the base install stays lean.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "xarray>=2024.7,<2027",
    "pydantic>=2.7,<3",
    "pyyaml",
    "pyproj>=3.6,<4",
    "shapely>=2.0,<3",
    "affine",
    "rasterio>=1.4,<2",
    "rioxarray>=0.17,<1",
    "requests",
    "earthaccess",
    "zarr>=3.0,<4",
    "numcodecs>=0.13,<1",
    "scipy>=1.13,<2",
    "h5netcdf>=1.4,<2",                # xarray engine for the MUR SST backbone (mur.py)
    # The engine EVERY aligned file is WRITTEN with (store.NETCDF_ENGINE). Core, not an
    # extra: left to xarray's default order this slot is filled by whichever engine happens
    # to be installed, so the same code wrote through netcdf4 in a conda env and h5netcdf in
    # a bare pip install -- different HDF5 stacks, silently. It also reads MODIS L2P swaths.
    "netcdf4>=1.7,<2",
]

[project.optional-dependencies]
# Per-product backends -- install only what your config selects.
landsat = ["planetary-computer", "pystac-client"]        # landsat_pc source
landcover = ["planetary-computer", "pystac-client"]      # landcover_esa source
modis = ["pyresample", "harmony-py"]                      # swath -> grid resampling; harmony-py = server-side subsetting (netcdf4, which reads MODIS L2P, is core)
met = ["herbie-data", "gcsfs", "pyresample"]              # HRRR + ARCO-ERA5 forcing
tides = ["pytides2"]                                      # NOAA CO-OPS harmonic synthesis
cmems = ["copernicusmarine>=2"]                            # Copernicus Marine global physics
tides-global = ["eo-tides"]                               # global tide-model backup
plot = ["matplotlib", "cartopy"]                          # `grids --plot` maps
extract = ["pyarrow>=16"]                                 # parquet output for `extract` (csv needs nothing)
# Convenience bundles.
all = [
    "planetary-computer", "pystac-client", "pyresample", "harmony-py",
    "herbie-data", "gcsfs", "pytides2", "eo-tides", "copernicusmarine>=2",
    "matplotlib", "cartopy", "pyarrow>=16",
]
dev = ["pytest"]

[project.scripts]
coastal-sst-data = "coastal_sst_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
