name: COASTAL_DATA_TESTS

# output directory
output_dir: "path/to/data"

# Date range to load data for the project
time:
  start_date: "2026-06-01"
  end_date: "2026-06-30"

# How to authenticate (NON-secret). Real credentials live in ~/.netrc, a key
# file, or env vars -- never here. Required for the products that need them
# (ecostress/mur -> earthdata; landsat/landcover -> gee).
auth:
  earthdata:
    auth_strategy: netrc
  copernicus:                # CMEMS; secret lives in ~/.netrc under
    auth_strategy: netrc     #   machine auth.marine.copernicus.eu
  # Mid-run re-authentication. A multi-year acquisition outlives its credential, and an
  # expired token looks exactly like the date range ending -- so a credential older than
  # max_age_s is replaced at the next safe boundary, and one rejected mid-read is replaced
  # and retried once. Both defaults are usually right; lower max_age_s to exercise the path.
  # NOTE: auth_strategy `interactive` is deliberately NEVER auto-refreshed -- it would block
  # an unattended run on a password prompt. Use netrc or environment for long runs.
  max_age_s: 1800            # 30 min
  max_refreshes: 20          # per backend per run; exceeded -> a real failure, not a retry

# =========================================================================== #
# PARALLELISM (optional; the whole block can be deleted)
#
# A run spends most of its wall clock WAITING ON OTHER PEOPLE'S SERVERS, and most of that
# waiting is independent. This block decides how much of it overlaps. It changes only how
# many pieces are in flight -- never what the run produces: the same files land in the same
# places, and `jobs: 1` takes the original serial code path rather than a one-worker
# emulation of the new one.
#
# The values below are the DEFAULTS (serial), spelled out so they are easy to raise. Delete
# the block entirely and you get exactly the same thing.
#
#   coastal-sst-data run --config config.yaml --jobs 8      # or override on the CLI
# =========================================================================== #
runtime:
  # ---- How many acquisitions at once -------------------------------------- #
  # One task is a (product, AoI) PAIR, so 8 might be `mur` for Tillamook while `landsat`
  # runs for Padilla. Only three ordering constraints exist, and all three are one product
  # reading another's aligned files: modis <- landsat, and mur/met_overpass <- the thermal
  # sensors. Every other product starts immediately.
  #
  # Those edges are PER-AoI, because each of those reads is scoped to an AoI. So mur(padilla)
  # waits for landsat(padilla) but NOT for landsat(tillamook) -- there is no barrier between
  # AoIs at all.
  #
  # A good starting point on a server is 8. Raise it if the run is clearly network-bound and
  # the gates below (not this number) are what is holding it back.
  jobs: 1

  # ---- How many AoIs assemble/preprocess at once -------------------------- #
  # Deliberately separate from `jobs`, and much smaller. These stages are bounded by MEMORY,
  # not by the network, and THE MEMORY BUDGET IS DIVIDED BETWEEN THEM: `budget_bytes` detects
  # the machine's memory and halves it on the assumption it owns the box, which stops being
  # true the moment two AoIs assemble at once. With assemble_jobs: 4 on a 200 GB machine each
  # AoI gets ~25 GB rather than 100 GB, and `datacube.block_days: auto` just produces smaller
  # (still chunk-aligned) blocks. The division is logged per run.
  #
  # Keep this low. An acquisition failure costs a retry; an OOM here throws away all the
  # downloading, which is the expensive part. 2 is a sensible ceiling on most machines.
  #
  # assemble(aoi) and preprocess(aoi) are CHAINED, never overlapped -- they read and rewrite
  # the same <aoi>.zarr. That chaining is also the win: one AoI preprocesses while the next
  # is still assembling.
  assemble_jobs: 1

  # ---- Per-SERVICE caps --------------------------------------------------- #
  # This is the answer to "how many calls may I make to one API on one account", and it
  # differs enough per service that one `jobs` number cannot express it. Products sharing a
  # SERVER share a gate -- mur, modis and ecostress are three products behind ONE Earthdata
  # account, so a cap on `earthdata` is what actually protects the account. (Which gate a
  # product belongs to is declared on its ProductSpec, not here.)
  #
  # All workers run in ONE PROCESS, so they share one login per backend, one refresh budget
  # and one rate-limit window: 8 workers across 3 Earthdata products and 2 AoIs produce
  # exactly ONE login, same as jobs: 1.
  #
  # Omit `gates` (or any single key) for the values below. Raise them when the run moves
  # closer to the data -- in-region on AWS, Earthdata tolerates far more than it does over a
  # home link.
  gates:
    earthdata: 6      # mur, modis, ecostress. `earthaccess` also threads INTERNALLY, so the
                      #   real connection count is a multiple of this; CMR search is the
                      #   throttled part.
    pc: 4             # landsat, landcover. Planetary Computer is ANONYMOUS -- no account, so
                      #   no per-account limit; throttling is per-IP.
    herbie: 4         # met, met_overpass (HRRR via Herbie).
    copernicus: 1     # cmems. The lazy dataset handle carries its own client and is not safe
                      #   to share; the toolbox parallelises internally already.
    noaa_small: 1     # tides. Small public metadata API behind a shared HTTP session.
    erddap: 1         # insitu. Same.
    dem: 1            # bathymetry. One CUDEM tile-index cache file, shared by every AoI.

# Grid
grid:
  resolution_m: 100          # target posting in metres
  target_crs: auto           # "auto" -> local UTM per AOI, or e.g. "EPSG:32610"
  resampling_continuous: bilinear
  resampling_categorical: nearest
  snap_origin: true

# Data products to acquire, with GLOBAL (project-wide) options per product.
products:
  bathymetry:              # a bare product -> default options
  ecostress:
    # DISTINCT-DATA collection VERSIONS are STACKED (one eco_sst_<ver> channel-set each), not
    # picked-one: v002 starts earlier, v003 reaches the present -- stack both to span a range
    # no single collection covers. Absent -> v002 only. (The old scalar `version:` is gone.)
    versions: [v003, v002]
  mur:
    variable: analysed_sst
    # Fetch only the days a sensor flew, by CHANNEL PREFIX (eco/lst/modis). MUR's job here is
    # the cloud-filter baseline, which can only read a day a sensor also imaged -- so over a
    # long window most daily downloads produce a file nothing reads. Unset -> every day.
    # Region-overridable. Leave commented unless you want the restriction (see README).
    # overpass_sensors: [eco]
  cmems:                     # Copernicus Marine global physics (offshore water column)
    # DISTINCT-DATA sources are STACKED (one cmems_<var>_<tag> channel each), not picked-one:
    # my_global (GLORYS12 reanalysis), anfc_global (analysis/forecast). Regional models
    # register a tag under `datasets` and a region lists it in `sources` (see below).
    variables: [thetao]      # also: so, uo, vo, zos, mlotst
    datasets: # for forecasts and recent years we need to point to the cmems data set directly
      anfc_global: cmems_mod_glo_phy-thetao_anfc_0.083deg_P1D-m
    depths: [0, 10]      # metres; each SNAPPED to the nearest model level
  landsat:
    source: "pc"        # pc (default) | aws | gee
  modis:                # the standalone ~1 km thermal sensor (GHRSST MODIS L2P skin SST)
    # DISTINCT-DATA PLATFORMS are STACKED (one modis_sst_<platform> channel-set each), not
    # picked-one: Terra and Aqua are two spacecraft in two orbits and never observe the same
    # overpass. ORDER MATTERS -- the first listed wins the single overpass identity that the
    # in-situ / met / tide matchups key off. Absent -> both, terra first.
    platforms: [terra, aqua]
    # night | day | both. Decided on LOCAL MEAN SOLAR time at the AoI, not on a fixed clock:
    # NASA stopped maintaining both orbits (Terra 2020, Aqua 2021) and the crossings have
    # since drifted hours -- Terra's morning 10:30 -> ~09:00, Aqua's afternoon 13:30 -> ~15:50
    # -- so a fixed UTC window silently loses the ends of a long record.
    time_of_day: night
    # night_solar_hours: [19, 5]   # the window that means "night"; wraps midnight
    quality_min: 4      # GHRSST quality_level: >=4 acceptable, 5 best
    # download -> whole granules (~15-25 MB each, ~15 variables, global swath).
    # harmony  -> server-side bbox + variable subset, so only the AoI crosses the wire.
    # A night Terra+Aqua series is tens of thousands of granules, hence the default.
    access: harmony
  # modis_ref:          # OPTIONAL: the same instrument as a LANDSAT-COINCIDENT reference,
  #                     #   for calibrating Landsat's absolute scale against MODIS.
  #   match_landsat: true          # keep only granules near an acquired Landsat scene
  #   max_time_diff_minutes: 360
  #   time_of_day: day             # Landsat flies in the morning
  #   access: download             # its footprint ids index the NATIVE swath -- do not subset
  met:                        # daily FORCING (no sensor dependency)
    # DISTINCT-DATA sources STACKED (one <var>_<src> channel each): hrrr (N. America), era5
    # (global). No fallback -- a region outside HRRR stacks only era5.
    sources: [hrrr, era5]
    variables: [airtemp, wind, swrad, cloud]
    # One snapshot per day at a fixed TIME OF DAY -- the cube's default met channel.
    # 10:30 is Landsat's overpass; the basis is LOCAL SOLAR, so it is the same time of
    # day in every AOI (a fixed UTC hour would not be). null to skip.
    reference_time: "10:30"
    reference_basis: solar    # solar (local, per-AOI longitude) | utc
    daily_mean_hours: [0, 6, 12, 18]   # UTC hours averaged for the daily field ([] = skip)
  met_overpass:               # met matched to each thermal sensor's overpass instant
    sources: [hrrr, era5]
    variables: [airtemp, wind, swrad, cloud]
    # Which (sensor, source) pairings to produce -> cube channels <sensor>_<var>_<src>.
    combinations: [[lst, hrrr], [eco, hrrr]]
  tides:
    interval: h               # prediction step (h = hourly)
    # Optional per-AOI gauge overrides (else nearest CO-OPS water-level station):
    # stations: {hood_canal: "9445133"}
  insitu:                    # in-situ buoys/gauges -- the cube's ground truth
    # STACKED: every source listed is acquired into its own INSITU/<source>/ tree and the
    # cube merges their platforms into ONE station table. `ioos` discovers public buoys;
    # `csv` reads your own files. List both to get both.
    sources: [ioos]          # ioos (IOOS Sensors ERDDAP: NDBC + CO-OPS + CDIP + regionals) | csv
    variables: [sea_water_temperature]   # falls back to sea_surface_temperature per station
    qc_flags: [1, 2]         # QARTOD: 1 pass, 2 not-evaluated (3/4/9 dropped)
    max_sensor_depth_m: 5    # ignore deep sensors on profiling moorings (csv: your `z` column;
                             # |z| is compared, so either sign convention works)
    # stations: [noaa_nos_co_ops_9437540]   # optional allow-list (else auto-discovered)
    # exclude_stations: []
    # --- the `csv` source: your own thermometers, in long format ----------------------
    # One row per observation. Rows are GROUPED BY station_id, so one file may hold any
    # number of platforms -- each becomes its own station, in its own pixel.
    # path: ~/data/moorings/*.csv        # a file, a directory, or a glob
    # columns:                           # only the ones whose names differ from these
    #   station_id: station_id
    #   time: time
    #   latitude: latitude
    #   longitude: longitude
    #   value: value
    #   # optional, used when present: z, qc, station_name
    # time_zone: UTC          # what a timestamp with no offset is assumed to be; a stamp that
                              # CARRIES an offset is honoured regardless. No format imposed --
                              # ISO 8601 ("2026-06-01T18:00:00Z") is the safe choice.
    # units: degC             # degC | degF | K -- converted to degC
    # qc_pass_values: [1, 2]  # values of the qc column to keep; omit to keep every row
    # default_station_id: null  # id for a single-platform file with no station_id column
  landcover:
    source: esa               # esa (ESA WorldCover via Planetary Computer) | gee (future)
    year: 2021                # WorldCover v200 (2021); 2020 -> v100
    water_classes: [80]       # WorldCover: 80 = permanent water bodies

# How the aligned per-product files are knitted into one Zarr cube per AOI.
# Every field has a default, so the whole block is optional.
datacube:
  chunks: {time: 64, y: 128, x: 128}
  # NOTE: fill_mur_water / fill_cmems_water / water_level were REMOVED. The cube ships raw
  # ingredients (observed values with honest NaN gaps; elevation + depth + tide) and
  # masking/filling/water-level are downstream modelling determinations. The DEM->MSL datum
  # offset still ships as the datum_offset_m / datum_status cube attributes.
  met_time: reference        # reference (products.met.reference_time) | daily_mean
  insitu: true               # buoy value at the reference time + a matchup per overpass
  insitu_max_dt_min: 60      # matchup tolerance; beyond it an overpass gets NaN
  # Days assembled+written per pass. Peak memory is channels x block_days x height x width x 4,
  # so this is what keeps a long window on a large AOI from being killed by the kernel.
  # "auto" sizes it per AOI from the grid and the budget below; an AOI that fits is still
  # assembled in ONE pass. An integer pins it.
  block_days: auto
  # Budget "auto" spends. Unset -> detected ($COASTAL_SST_DATA_MEM_GB, $SLURM_MEM_PER_NODE,
  # the cgroup limit, then physical RAM) and HALVED. Set it when the assembler shares a
  # machine, or when the detected number is not what the job is actually allowed.
  # memory_budget_gb: 24
  # (Met-at-overpass moved to the `met_overpass` product above; overpass_met was removed.)

# Optional POST-ASSEMBLY preprocessing. Runs AFTER assembly: opens each datacube/<aoi>.zarr,
# adds its derived channels, and rewrites THAT SAME store -- one cube holding raw and derived
# side by side. The assembled channels are never overwritten (every derived channel gets a name
# of its own, e.g. mur_sst_gapfilled / eco_sst_v002_clean), so re-running is safe and needs no
# re-assembly. Opt-in: nothing runs unless `enabled: true` AND you pass --preprocess (or the
# `preprocess` subcommand). This is where the masking/filling/water-level the cube omits get a
# home. NOTE: `output_subdir`, `chunks` and `compression` are NOT valid here -- there is no
# separate cube to place or encode, so a config that sets them fails validation.
preprocess:
  enabled: false
  # Memory blocking, exactly as datacube.block_days / memory_budget_gb -- this stage reads a whole
  # cube and writes a larger one, so it has the same problem. Unset -> inherit the datacube value.
  # Set them when preprocessing needs a smaller block than assembly did, which it can: it holds
  # the channels it READS as well as the ones it derives.
  # block_days: auto
  # memory_budget_gb: 16
  steps:
    # Tide-adjusted waterline per thermal sensor, at its overpass -> <sensor>_water_elev /
    # <sensor>_water_class. Source tags default to the sole DEM/tide present if unset.
    water_line: { dem_source: cudem, tide_source: coops, sensors: [eco, lst] }
    # Nearest-neighbour fill of the level-4 SST gaps over water (landcover_water==1) into
    # <channel>_gapfilled, beside the untouched source, with a <channel>_filled companion mask
    # (1=invented, 0=observed).
    fill_water: { sources: [mur, cmems]}
    # ECOSTRESS cloud screening vs a gap-free L4 baseline (MUR/CMEMS). Cloud biases thermal-IR
    # SST cold, so a pixel far COLDER than the baseline is likely cloud. Drops fold into a
    # SCREENED product eco_sst_<ver>_clean / eco_valid_<ver>_clean (the raw channels keep their
    # own values) + a <channel>_clean_cloudfiltered flag. Runs after fill_water so `offset` mode
    # sees the gap-filled baseline.
    #   method: offset -> drop where baseline - eco > threshold_k (K); <=0 disables.
    #   method: sigma  -> drop where eco < climatology mean - n_sigma*sigma, fit from the
    #                     baseline's OWN observed climatology (stat_scope: pixel|pooled,
    #                     seasonality: off|harmonic).
    filter_clouds: { method: offset, baseline: mur_sst, threshold_k: 5.0, sensors: [eco] }
    #   ...or the distribution-based, seasonally-aware variant: drop where eco is colder than the
    #   baseline's own climatology mean - n_sigma*sigma (stat_scope: pixel|pooled, seasonality: off|harmonic).
    # filter_clouds: { method: sigma, baseline: mur_sst, n_sigma: 3.0, stat_scope: pixel, seasonality: harmonic, sensors: [eco] }
    # Meteorological cloud-cover gate on ECOSTRESS using the HRRR/ERA5 total-cloud-cover field
    # (percent). A pixel drops if EITHER gate fires: scene-level (AOI-mean cloud at overpass >
    # scene_max_pct -> drop the whole overpass) or per-pixel (> pixel_max_pct). A null/>=100
    # threshold disables that gate. Emits a <channel>_clean_metcloudfiltered flag and a
    # <sensor>_scene_cloud_pct_<src> diagnostic. Composes with filter_clouds (both write the same
    # _clean product, so drops union).
    filter_cloud_cover: { scene_max_pct: 30, pixel_max_pct: 80, sensors: [eco] }
    # Over-land cloud screen: thermal-IR reads WARMER than air over land by day, so a land pixel
    # far colder than the HRRR/ERA5 air temperature is likely cloud. Drops where
    # airtemp - sst > threshold_k (a K difference == a degC one, so 5 means 5 K == 5 C). Gated to
    # LAND cells by land_source: `landcover` (static landcover_water==0) or `water_line`
    # (this sensor's <sensor>_water_class==exposed at overpass, which needs the water_line step).
    filter_land_clouds: { threshold_k: 5.0, land_source: landcover, sensors: [eco] }
    #   ...or gate on the tide-adjusted water line instead of the static landcover mask:
    # filter_land_clouds: { threshold_k: 5.0, land_source: water_line, sensors: [eco] }

regions:
  - name: pnw_estuaries
    # Region-DEPENDENT source options (which source has coverage here, etc.).
    sources:
      bathymetry:
        # DISTINCT-DATA sources are STACKED, not picked-one: list the DEMs to acquire here
        # (each gets its own depth_<src>/elevation_<src> channel). CUDEM covers CONUS; add
        # GMRT to fill gaps outside it. There is no `source`/`fallback`/`dem_source` any more.
        sources: [cudem]
        # Each DEM's DEM->MSL datum offset is resolved automatically as it is acquired (NOAA
        # VDatum for CUDEM/NAVD88, 0 for GMRT/MSL) and ships as per-source cube attributes.
        # datum_offset_m is a regional FALLBACK, used only when VDatum/CO-OPS cannot resolve
        # the offset (no coverage / wide spread / while a transient outage retries); a resolved
        # value always wins over it. Uncomment to give this region a best estimate:
        # datum_offset_m: 1.31   # elevation of MSL in the DEM's datum (m)
      # MUR's overpass-day filter is region-overridable, because WHICH sensors are worth
      # restricting to varies: a region you only image with ECOSTRESS should not pull a MUR
      # day for every near-daily MODIS pass. Overrides `products.mur.overpass_sensors`.
      # mur:
      #   overpass_sensors: [eco]
    # list aois in the region.
    areas:
      - name: tillamook_bay
        center_lat: 45.52
        center_lon: -123.925
        buffer_ns_km: 25
        buffer_ew_km: 15
  - name: puget_sound
        # list aois in the region.
    areas:
      - name: padilla_bay
        center_lat: 48.45
        center_lon: -122.58
        buffer_ns_km: 10
        buffer_ew_km: 10