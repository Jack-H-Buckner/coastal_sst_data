# Conda/mamba environment for coastal_sst_data -- installs the package straight
# from GitHub (no local clone needed). Use this to *run* the project on another
# machine; for developing the package use environment.yml (editable install).
#
#   conda env create -f environment.github.yml     # add -n <name> for a custom env name
#   conda activate coastal_sst_data
#
# conda-forge provides the compiled geospatial stack (GDAL/PROJ, eccodes, a single
# coordinated OpenMP) so no native deps come from pip wheels. pip then pulls only
# the package from GitHub -- every runtime dep is already satisfied by conda above.
name: coastal_sst_data
channels:
  - conda-forge
dependencies:
# REPRODUCIBILITY: the packages below are PINNED because they can change what a cube
# CONTAINS, not merely how it is built. zarr in particular is branched on directly
# (processes/datacube.py picks BloscCodec vs numcodecs.Blosc, and 'compressors' vs
# 'compressor', off the major version), so the same config on the same data produced a
# differently-encoded cube depending on when the env happened to be created. Floors and
# ceilings rather than exact pins: reproducible where it matters, still installable.
  - python=3.11
  - pytest
  # Core stack (also declared in pyproject.toml [project.dependencies]); pinned
  # here via conda so the compiled GDAL/PROJ libs come from conda-forge, not pip.
  - numpy>=2.0,<3
  - pandas>=2.2,<3
  - xarray>=2024.7,<2027
  - pydantic>=2.7,<3
  - pyyaml
  - pyproj>=3.6,<4
  - shapely>=2.0,<3
  - affine
  - rasterio>=1.4,<2
  - rioxarray>=0.17,<1
  - requests
  - earthaccess
  - zarr>=3.0,<4
  - numcodecs>=0.13,<1
  # xarray file-reader engines: h5netcdf reads the MUR SST backbone (mur.py);
  # netcdf4 reads MODIS L2P swaths (modis.py).
  - h5netcdf>=1.4,<2
  - netcdf4>=1.7,<2
  # Landsat via Planetary Computer (landsat_pc.py): STAC search + COG reads.
  - pystac-client
  - planetary-computer
  # MODIS swath -> grid resampling (modis.py) and HRRR regridding (met.py).
  - pyresample>=1.28,<2
  # MODIS server-side subsetting (modis.py, access: harmony) -- see environment.yml.
  - harmony-py
  # datacube.py assembler: nearest-neighbour water fill of the MUR + CMEMS channels.
  - scipy>=1.13,<2
  # met.py forcing: HRRR via Herbie; ERA5 fallback streamed from the public
  # ARCO-ERA5 Zarr on GCS (zarr reader + anonymous GCS filesystem).
  - herbie-data
  - gcsfs
  # cmems.py: Copernicus Marine global physics (GLORYS12 reanalysis + analysis/forecast).
  # Needs a free Copernicus Marine account; the secret lives in ~/.netrc under
  # `machine auth.marine.copernicus.eu` (see auth.copernicus in the config).
  - copernicusmarine
  # tides.py global backup: eo-tides (pyTMD) samples a global ocean-tide model
  # (EOT20 etc.) where NOAA CO-OPS has no nearby gauge. Needs a downloaded
  # tide-model directory (see the eo-tides "Setting up tide models" docs).
  - eo-tides
  # Optional plotting: `coastal-sst-data grids --plot` draws AoI maps. matplotlib
  # is required for the maps; cartopy is optional (adds coastlines/land context).
  - matplotlib
  - cartopy
  - pip
  - pip:
      # Install the package itself from GitHub (core deps already provided by conda
      # above). Change @main to @dev, @<tag>, or @<commit-sha> to pin a version.
      - git+https://github.com/Jack-H-Buckner/coastal_sst_data.git@main

# --- CO-OPS tides backend: a required SEPARATE step (do NOT add pytides2 above) ---
# pytides2 (the `tides` product's default CO-OPS source) is NOT on conda-forge and
# declares a broken pin (numpy>=1.19,<1.19.4); listing it in the pip: block makes
# pip downgrade numpy and fail building an ancient sdist. coastal_sst_data ships a
# compat shim, so it runs fine on modern numpy when installed WITHOUT its deps.
# After the env is created, only if you use the CO-OPS tide source:
#
#   conda activate coastal_sst_data
#   pip install --no-build-isolation --no-deps pytides2
